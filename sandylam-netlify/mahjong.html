
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>封面連連看 — 林憶蓮鐵粉挑戰賽</title>
<link rel="stylesheet" href="css/mahjong.css" />
</head>
<body>

<!-- ==================== 導航列 ==================== -->
<nav class="navbar">
  <button class="hamburger" onclick="document.querySelector('.nav-links').classList.toggle('open')">
    MENU▾
  </button>
  <a class="logo" href="/">
    <img src="images/sandylam-icon.png" alt="">
    林憶蓮鐵粉挑戰賽
  </a>
  <div class="nav-links">
    <a href="/">首頁</a>
    <a href="/championship.html">冠軍賽</a>
    <a href="/song-quiz.html">猜歌挑戰</a>
    <a href="/album-quiz.html">猜專輯</a>
    <a href="/cover-quiz.html">猜翻唱歌名</a>
    <a href="/cover-album-quiz.html">猜翻唱專輯</a>
    <a href="/memory.html">記憶翻牌</a>
    <a href="/match.html">封面消消樂</a>
    <a href="/mahjong.html" class="active">封面連連看</a>
  </div>
  <div class="mj-global-toolbar">
    <button id="mjSoundBtn" onclick="toggleSound()" title="音效開關">🔊</button>
  </div>
</nav>

<!-- ==================== 首頁 ==================== -->
<div id="mj-intro" class="mj-game-inner">
  <div class="guess-result-card">
    <h1 style="font:700 24px 'Noto Serif TC',serif;color:#B08A3E;margin-bottom:.2rem;">Cover Mahjong</h1>
    <h2 style="font:700 18px 'Noto Serif TC',serif;color:#201E1F;margin-bottom:1rem;">封面連連看</h2>
    <p style="font:400 14px 'Noto Sans TC',sans-serif;color:#5C6B73;line-height:1.6;margin-bottom:1.5rem;">
      專輯封面堆成多層山丘，找出「上面沒被蓋住、左右至少一邊淨空」的兩張相同封面點掉它們，挑戰在時間內全部清空！
    </p>

    <!-- 難度選擇 -->
    <div class="mode-selection">
      <p class="selection-title">選擇難度</p>
      <label class="mode-option">
        <input type="radio" name="mj-mode" value="easy" checked>
        <span class="mode-label">初級（5 分鐘）</span>
        <span class="mode-desc">時間較充裕，慢慢找</span>
      </label>
      <label class="mode-option">
        <input type="radio" name="mj-mode" value="medium">
        <span class="mode-label">中級（4 分鐘）</span>
        <span class="mode-desc">時間適中，手腳要快</span>
      </label>
      <label class="mode-option">
        <input type="radio" name="mj-mode" value="hard">
        <span class="mode-label">最高級（3 分鐘）</span>
        <span class="mode-desc">時間緊迫，考驗眼力反應</span>
      </label>
      <label class="mode-option mode-zen">
        <input type="radio" name="mj-mode" value="zen">
        <span class="mode-label">🧘 禪模式</span>
        <span class="mode-desc">無時間限制，純粹享受</span>
      </label>
      <label class="mode-option mode-speed">
        <input type="radio" name="mj-mode" value="speed">
        <span class="mode-label">⚡ 極速模式</span>
        <span class="mode-desc">比誰清得快</span>
      </label>
      <label class="mode-option mode-daily">
        <input type="radio" name="mj-mode" value="daily">
        <span class="mode-label">📅 每日挑戰</span>
        <span class="mode-desc">每天一局，公平比較</span>
      </label>
    </div>

    <!-- 牌型選擇 -->
    <div class="mj-shape-selector">
      <p class="selection-title">選擇牌型</p>
      <div id="mjShapeSelector" class="mj-shape-options">
        <!-- JS 動態渲染 -->
      </div>
    </div>

    <button class="guess-option-btn" style="justify-content:center;font-weight:700;color:#B08A3E;border-color:#B08A3E;margin-top:1rem;" onclick="startGame()">開始挑戰</button>

    <br>
    <button class="guess-option-btn" style="justify-content:center;margin-top:.5rem;" onclick="toggleProfilePanel()">📊 我的紀錄 / 成就</button>
    <div id="mjProfilePanel" hidden></div>

    <!-- 排行榜 -->
    <div class="leaderboard-section">
      <p class="leaderboard-title">🏆 排行榜</p>
      <div class="leaderboard-grid">
        <details class="leaderboard-col">
          <summary class="lb-col-title">最高級（3分鐘）</summary>
          <div id="lbHard"></div>
        </details>
        <details class="leaderboard-col">
          <summary class="lb-col-title">中級（4分鐘）</summary>
          <div id="lbMedium"></div>
        </details>
        <details class="leaderboard-col">
          <summary class="lb-col-title">初級（5分鐘）</summary>
          <div id="lbEasy"></div>
        </details>
        <details class="leaderboard-col">
          <summary class="lb-col-title">⚡ 極速模式</summary>
          <div id="lbSpeed"></div>
        </details>
        <details class="leaderboard-col">
          <summary class="lb-col-title">📅 每日挑戰</summary>
          <div id="lbDaily"></div>
        </details>
      </div>
    </div>
  </div>
</div>

<!-- ==================== 遊戲畫面 ==================== -->
<div id="mj-game" class="mj-game-inner" hidden>
  <p id="mjShapeName" class="mj-shape-name">花色：三丘尖塔</p>

  <div class="whack-status">
    <span id="mjScore">分數：0</span>
    <span id="mjPairs">0 / 48 對</span>
    <span id="mjTimeLeft">⏱ 05:00</span>
  </div>

  <div id="mjComboDisplay" class="mj-combo-display" hidden></div>

  <div class="mj-toolbar">
    <button id="mjHintBtn" class="guess-option-btn mj-tool-btn" onclick="showHint()">💡 提示 (2)</button>
    <button id="mjPauseBtn" class="guess-option-btn mj-tool-btn" onclick="pauseGame()">⏸ 暫停</button>
    <button id="mjShuffleBtn" class="guess-option-btn mj-tool-btn" onclick="manualShuffle()">🔀 洗牌 (3)</button>
  </div>

  <div class="mj-board-wrap">
    <div id="mjBoard" class="mj-board"></div>
  </div>

  <button id="mjStopBtn" class="guess-option-btn mj-tool-btn" onclick="endGame(false)">結束遊戲</button>

  <div id="mjPauseOverlay" class="mj-pause-overlay" hidden>
    <p class="mj-pause-title">⏸ 已暫停</p>
    <p class="mj-pause-sub">計時跟扣分都停住了，準備好再繼續</p>
    <button class="guess-option-btn mj-tool-btn" onclick="resumeGame()">▶ 繼續遊戲</button>
  </div>
</div>

<!-- ==================== 結果頁 ==================== -->
<div id="mj-result" class="mj-game-inner" hidden>
  <div class="guess-result-card">
    <h2 id="resultTitle" style="font:700 20px 'Noto Serif TC',serif;color:#201E1F;margin-bottom:.5rem;">挑戰結束！</h2>
    <p id="resultMode" class="result-mode"></p>
    <p id="resultScore" class="result-big"></p>
    <p id="resultDetail" class="result-detail"></p>

    <!-- 統計面板 -->
    <div id="resultStats" hidden></div>

    <!-- 提交成績 -->
    <div id="submitScoreWrap" class="submit-score-wrap">
      <p class="submit-title">登上排行榜</p>
      <div class="submit-form">
        <input type="text" id="playerName" placeholder="輸入你的名字" maxlength="20">
        <button id="submitScoreBtn" class="guess-option-btn mj-tool-btn" onclick="submitScore()">提交成績</button>
      </div>
    </div>

    <p id="scoreSubmitted" class="score-submitted" hidden>✓ 成績已提交！</p>

    <div id="resultLeaderboard" hidden></div>

    <!-- 分享 & 再玩 -->
    <div style="display:flex;gap:.5rem;justify-content:center;margin-top:1rem;flex-wrap:wrap;">
      <button id="mjShareBtn" class="mj-share-btn" onclick="shareResult()">📤 分享成績</button>
      <button class="guess-option-btn mj-tool-btn" style="color:#B08A3E;border-color:#B08A3E;font-weight:700;" onclick="showScreen('mj-intro')">再玩一次</button>
    </div>
  </div>
</div>

<!-- ==================== 載入遊戲引擎 ==================== -->
<script src="js/mahjong.js"></script>

</body>
</html>
