<html lang="zh-Hant">

<title>專輯島｜林憶蓮鐵粉挑戰賽</title>
<meta name="description" content="林憶蓮 33 張錄音室專輯，一張一座島，依發行年份排列。點開島看曲目、聽 30 秒試聽。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* 專輯島：變數與樣式都加 isl 前綴，避免和全站 style.css 衝突。
   顏色字體優先沿用全站變數（--ink、--paper、--slate 等），讀不到時用括號內的備用值。 */
.isl-main{
  --isl-sea:#E8F0F2;
  --isl-y:#B5472F;   /* 粵語 */
  --isl-m:#667A35;   /* 國語（與英語對調）*/
  --isl-j:#1B7F8E;   /* 日語（與 3D 版一致）*/
  --isl-e:#D9A21B;   /* 英語（與國語對調）*/
  --isl-ink:var(--ink,#201E1F);
  --isl-soft:var(--slate,#5C6B73);
  --isl-paper:var(--paper-dim,#EDE7DA);
  --isl-serif:var(--font-display,"Noto Serif TC",serif);
}
/* 蓋掉全站 main 的寬度限制，島需要比較寬的版面 */
main.isl-main{max-width:none;margin:0;padding:0}

.isl-layout{display:block}
.map-col{padding:28px clamp(16px,4vw,40px) 40px;max-width:760px;margin:0 auto}
.isl-title{
  font-family:var(--isl-serif);
  font-size:clamp(28px,6vw,40px);
  font-weight:700;
  letter-spacing:.08em;
  line-height:1.3;
  margin:0 0 8px;
}
.isl-desc{margin:0 0 14px;color:var(--isl-soft);font-size:15px;line-height:1.7;max-width:34em}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 16px;padding:0;list-style:none;font-size:14px}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.isl-sea{background:var(--isl-sea);border-radius:12px;padding:6px;overflow:hidden}
#map{display:block;width:100%;height:auto;touch-action:manipulation;border-radius:8px}
.isle{cursor:pointer;outline:none}
.isle .land{transition:transform .18s ease}
.isle:hover .land,.isle.on .land{transform:translateY(-3px)}
.isle .ring{fill:none;stroke:var(--isl-ink);stroke-width:2.5;opacity:0;transition:opacity .15s}
.isle.on .ring,.isle:focus-visible .ring{opacity:1}
.isle text{pointer-events:none;font-family:var(--font-body,"Noto Sans TC",sans-serif)}
.isle .t{font-size:12.5px;font-weight:700;stroke:rgba(30,26,24,.55);stroke-width:1.1px;stroke-linejoin:round;paint-order:stroke fill}
.isle .yr{font-size:10px;opacity:.9;stroke:rgba(30,26,24,.55);stroke-width:.9px;stroke-linejoin:round;paint-order:stroke fill}
.isle-e .t{stroke-width:1.8px}
.isle-e .yr{stroke-width:1.4px}
.rowyear{font-size:11px;fill:var(--isl-soft);font-family:var(--font-body,"Noto Sans TC",sans-serif)}
.isl-credit{margin:16px 0 0;font-size:12.5px;line-height:1.7;color:var(--isl-soft)}

/* 專輯面板 */
#panel{
  background:var(--isl-paper);
  color:var(--isl-ink);
  padding:22px 20px 28px;
  z-index:30;
}
#panel .empty{color:var(--isl-soft);font-size:15px;margin:0}
#panel .cover{
  display:block;width:min(100%,200px);aspect-ratio:1/1;object-fit:cover;
  margin:0 0 16px;background:rgba(32,30,31,.08);
  box-shadow:0 6px 18px rgba(32,30,31,.22);
}
#panel .chip{
  display:inline-block;padding:2px 10px;border-radius:999px;
  font-size:13px;font-weight:700;color:#fff;background:var(--c);
}
#panel .chip.dark{color:#2A1F00}
#panel .no{margin:0 0 0 8px;font-size:13px;color:var(--isl-soft)}
#panel h2{font-family:var(--isl-serif);font-size:26px;line-height:1.3;margin:12px 0 14px;overflow-wrap:anywhere}
#panel dl{display:grid;grid-template-columns:5em 1fr;gap:4px 8px;margin:0 0 18px;font-size:15px}
#panel dt{color:var(--isl-soft)}
#panel dd{margin:0}
#panel h3{font-size:15px;margin:0 0 6px}
#panel .pending{margin:0 0 18px;font-size:14px;color:var(--isl-soft)}
#panel a.wiki{font-weight:700;color:var(--isl-ink)}
#panel .src{margin:-8px 0 18px;font-size:12px;color:var(--isl-soft)}
#panel .spotify{margin:0 0 18px}
#panel .spotify iframe{display:block;width:100%;height:352px;border:0;border-radius:12px}
#panel .tracks{list-style:none;margin:0 0 18px;padding:0;font-size:15px;counter-reset:n}
#panel .tracks li{counter-increment:n;display:flex;align-items:flex-start;gap:8px;padding:2px 0}
#panel .tracks li::before{content:counter(n);flex:none;width:1.6em;text-align:right;color:var(--isl-soft);font-size:13px;line-height:2.1}
#panel .tracks button{
  flex:1;display:flex;align-items:flex-start;gap:8px;text-align:left;
  border:0;background:transparent;font:inherit;color:inherit;
  padding:5px 8px;border-radius:8px;cursor:pointer;min-height:34px;
}
#panel .tracks button:hover,#panel .tracks button:focus-visible{background:rgba(112,128,144,.16);outline:none}
#panel .tracks button .ic{flex:none;width:1.2em;color:var(--isl-soft)}
#panel .tracks button.playing{background:rgba(112,128,144,.24);font-weight:700}
#panel .tracks button.playing .ic{color:var(--isl-ink)}
#panel .tracks .nopv{flex:1;padding:5px 8px 5px calc(8px + 1.2em + 8px);color:var(--isl-soft);min-height:34px}
#panel .tracks .tt{overflow-wrap:anywhere}
#panel .note{margin:-8px 0 18px;font-size:12.5px;color:var(--isl-soft)}
#close{
  display:none;position:absolute;top:10px;right:12px;
  border:0;background:transparent;font:inherit;font-size:15px;color:var(--isl-ink);
  padding:8px 10px;cursor:pointer;
}

/* 滑鼠移到島上浮出的封面卡（只有能 hover 的裝置才會出現） */
#tip{
  position:fixed;left:0;top:0;z-index:50;width:176px;
  background:#fff;border:1px solid rgba(32,30,31,.12);border-radius:8px;
  padding:8px;box-shadow:0 10px 28px rgba(32,30,31,.22);
  pointer-events:none;opacity:0;transform:translateY(4px);
  transition:opacity .12s ease,transform .12s ease;
}
#tip.show{opacity:1;transform:none}
#tip .cv{display:block;width:160px;height:160px;object-fit:cover;border-radius:4px;background:#EDE7DA}
#tip .tt{margin:8px 2px 0;font-size:13px;font-weight:700;line-height:1.4;color:#201E1F}
#tip .ts{margin:0 2px;font-size:12px;color:#5C6B73}
@media (hover:none){#tip{display:none}}

@media (min-width:900px){
  /* 桌機不預留右欄：地圖占滿寬度，面板點島才從右邊滑出 */
  .isl-layout{display:block}
  .map-col{margin:0 auto;max-width:1100px;padding:32px 28px 48px clamp(20px,5vw,56px)}
  #panel{
    position:fixed;top:0;right:0;bottom:0;width:380px;max-width:86vw;
    background:var(--isl-paper);border-left:1px solid rgba(32,30,31,.12);
    box-shadow:-8px 0 28px rgba(32,30,31,.18);padding:0;z-index:40;
    transform:translateX(105%);transition:transform .28s ease;
  }
  #panel.open{transform:translateX(0)}
  #panel .empty{display:none}
  #panel .panel-in{max-height:100vh;overflow:auto;padding:52px 28px 36px}
  #close{display:block}
}
@media (max-width:899px){
  #panel{
    position:fixed;left:0;right:0;bottom:0;max-height:68vh;overflow:auto;
    border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(32,30,31,.18);
    transform:translateY(105%);transition:transform .25s ease;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
  }
  #panel.open{transform:translateY(0)}
  #panel .empty{display:none}
  #close{display:block}
}
@media (prefers-reduced-motion:reduce){
  .isl-main *,#tip{transition:none!important}
}
</style>
</head>

    const lines = (a.s || a.t).split('/');
    const g = sv('g', {
      class:'isle' + (a.l === 'e' ? ' isle-e' : '') + (i === cur ? ' on' : ''),
      tabindex:0, role:'button',
      'aria-label': a.t + '，' + dateText(a) + '，' + L.n
    });
    const land = sv('g', {class:'land'});
    land.append(
      sv('polygon', {points:hexPoints(cx, cy, R*0.80), fill:L.v, stroke:L.v, 'stroke-width':10, 'stroke-linejoin':'round'})
    );
    const first = cy - (lines.length-1)*7 - 2;
    lines.forEach((ln, k) => {
      land.append(sv('text', {x:cx, y:first + k*14, 'text-anchor':'middle', class:'t', fill:L.ink}, ln));
    });
    land.append(sv('text', {x:cx, y:cy + lines.length*7 + 9, 'text-anchor':'middle', class:'yr', fill:L.ink}, year(a)));

    g.append(
      sv('polygon', {points:hexPoints(cx, cy, R*0.98), fill:L.v, 'fill-opacity':'.22'}),
      land,
      sv('polygon', {class:'ring', points:hexPoints(cx, cy, R*0.95)})
    );
    g.addEventListener('click', () => select(i));
    g.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); select(i); }
    });
    /* hover 只對滑鼠生效，觸控不會跳出卡片 */
    g.addEventListener('pointerenter', e => {
      if (e.pointerType === 'mouse' && showTip(i)) placeTip(e.clientX, e.clientY);
    });
    g.addEventListener('pointermove', e => {
      if (e.pointerType === 'mouse' && tip.classList.contains('show')) placeTip(e.clientX, e.clientY);
    });
    g.addEventListener('pointerleave', hideTip);
    g.addEventListener('focus', () => {
      if (!g.matches(':focus-visible')) return;
      const r = g.getBoundingClientRect();
      if (showTip(i)) placeTip(r.right, r.top);
    });
    g.addEventListener('blur', hideTip);
    svg.append(g);
  });
}

/* 試聽：全站共用一個 Audio，同時只播一首 */
const audio = new Audio();
audio.preload = 'none';
let playingBtn = null;
function setBtn(b, on){
  if (!b) return;
  b.classList.toggle('playing', on);
  b.firstChild.textContent = on ? '⏸' : '▶';
}
function stopAudio(){
  audio.pause();
  setBtn(playingBtn, false);
  playingBtn = null;
}
function togglePlay(b){
  if (playingBtn === b){
    if (audio.paused){ audio.play().catch(() => stopAudio()); setBtn(b, true); }
    else { audio.pause(); setBtn(b, false); }
    return;
  }
  setBtn(playingBtn, false);
  playingBtn = b;
  audio.src = b.dataset.url;
  setBtn(b, true);
  audio.play().catch(() => stopAudio());
}
audio.addEventListener('ended', stopAudio);
audio.addEventListener('error', () => { if (playingBtn) stopAudio(); });

/* 專輯面板 */
function select(i){
  stopAudio();
  cur = i;
  [...svg.querySelectorAll('.isle')].forEach((n, k) => n.classList.toggle('on', k === i));
  const a = A[i], L = LANG[a.l];

  const chip = el('span', {class:'chip' + (a.l === 'e' ? ' dark' : '')}, L.n);
  chip.style.setProperty('--c', L.v);
  const dl = el('dl', null,
    el('dt', null, '發行'), el('dd', null, dateText(a)),
    ...(a.lb ? [el('dt', null, '唱片公司'), el('dd', null, a.lb)] : [])
  );

  const kids = [
    el('div', null, chip, el('span', {class:'no'}, '第 ' + (i+1) + ' 張')),
    el('h2', null, a.t),
    dl
  ];

  /* 封面放在面板最上面，載入失敗就直接移除，不會出現破圖 */
  const src = COVERS[a.t];
  if (src){
    const img = el('img', {class:'cover', src, alt:'《' + a.t + '》專輯封面', width:200, height:200});
    img.addEventListener('error', () => img.remove());
    kids.unshift(img);
  }

  const tr = TRACKS[a.t];
  if (tr && tr.length){
    const hasPv = tr.some(x => x[1]);
    kids.push(el('h3', null, '曲目'), el('ol', {class:'tracks'}, ...tr.map(x => {
      const li = el('li');
      if (x[1]){
        const b = el('button', {type:'button', 'aria-label':'試聽 ' + x[0]},
          el('span', {class:'ic', 'aria-hidden':'true'}, '▶'), el('span', {class:'tt'}, x[0]));
        b.dataset.url = x[1];
        b.addEventListener('click', () => togglePlay(b));
        li.append(b);
      } else {
        li.append(el('span', {class:'nopv'}, x[0] + '（無試聽）'));
      }
      return li;
    })));
    if (hasPv) kids.push(el('p', {class:'note'}, '點歌名試聽 30 秒片段，再點一次暫停。'), el('p', {class:'src'}, '試聽音樂來自 Apple Music'));
  } else if (a.p){
    kids.push(el('p', {class:'pending'}, '這張專輯的名稱還沒查到。資料腳本跑完後會補上。'));
  } else {
    kids.push(el('p', {class:'pending'}, '曲目還沒匯入。'));
  }

  /* Spotify 完整專輯播放器 */
  if (SPOTIFY[a.t]){
    const fr = el('iframe', {
      src:'https://open.spotify.com/embed/album/' + SPOTIFY[a.t],
      title:'《' + a.t + '》Spotify 播放器', loading:'lazy',
      allow:'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture'
    });
    kids.push(el('h3', null, '在 Spotify 聽完整專輯'), el('div', {class:'spotify'}, fr));
  }
  if (!a.p){
    kids.push(el('a', {
      class:'wiki', target:'_blank', rel:'noopener',
      href: a.w || ('https://zh.wikipedia.org/w/index.php?search=' + encodeURIComponent('林憶蓮 ' + a.t))
    }, '到維基百科查看'));
  }

  body.replaceChildren(...kids);
  panel.scrollTop = 0;
  document.querySelector('.panel-in').scrollTop = 0;
  panel.classList.add('open');
}
function closePanel(){
  stopAudio();
  panel.classList.remove('open');
  cur = -1;
  svg.querySelectorAll('.isle.on').forEach(n => n.classList.remove('on'));
  body.replaceChildren(el('p', {class:'empty'}, '點一座島，看那張專輯。'));
}
document.getElementById('close').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

let lastCols = 0;
window.addEventListener('resize', () => {
  const c = window.innerWidth < 560 ? 4 : 6;
  if (c !== lastCols){ lastCols = c; render(); }
});
lastCols = window.innerWidth < 560 ? 4 : 6;
render();
</script>
